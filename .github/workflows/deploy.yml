name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

env:
  AWS_ROLE_ARN: arn:aws:iam::753674274065:role/silvercare-cicd
  AWS_REGION: ap-southeast-1
  TERRAFORM_VERSION: 1.16.6
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  terraform:
    name: Terraform plan and apply
    needs: checks
    runs-on: ubuntu-latest
    # The Terraform root config lives in infra/.
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for Terraform config
        id: tf
        working-directory: .
        run: |
          if ls infra/*.tf >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No .tf files in infra/ yet, nothing to deploy."
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.tf.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: steps.tf.outputs.present == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        if: steps.tf.outputs.present == 'true'
        run: terraform init

      # The full plan isn't printed: the repo is public, so its logs are too.
      # The job summary lists the changed resources instead.
      - name: Terraform plan
        if: steps.tf.outputs.present == 'true'
        run: terraform plan -no-color -out=tfplan > /dev/null

      - name: Summarise plan
        if: steps.tf.outputs.present == 'true'
        run: '"$GITHUB_WORKSPACE/.github/scripts/plan-summary.sh" success tfplan /dev/null >> "$GITHUB_STEP_SUMMARY"'

      - name: Terraform apply
        if: steps.tf.outputs.present == 'true'
        run: terraform apply -no-color tfplan

      # The frontend is uploaded on every deploy, not only when frontend/ changed: the
      # build embeds Terraform outputs (Cognito IDs), and this also refills an empty bucket.
      - name: Set up Node
        if: steps.tf.outputs.present == 'true' && hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The IDs aren't secrets (they ship in the bundle), but they aren't printed either.
      - name: Build frontend
        if: steps.tf.outputs.present == 'true' && hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: |
          VITE_USER_POOL_ID="$(terraform -chdir=../infra output -raw cognito_user_pool_id)"
          VITE_USER_POOL_CLIENT_ID="$(terraform -chdir=../infra output -raw cognito_user_pool_client_id)"
          export VITE_USER_POOL_ID VITE_USER_POOL_CLIENT_ID
          npm ci
          npm run build

      # Hashed files in assets/ go first and are cached for a year; index.html and the
      # other root files go next with no-cache, so browsers pick up a new deploy at once.
      # Old assets are deleted last, after the new index.html no longer points to them.
      - name: Upload frontend
        if: steps.tf.outputs.present == 'true' && hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: |
          bucket="$(terraform -chdir=../infra output -raw frontend_bucket_name)"
          distribution="$(terraform -chdir=../infra output -raw frontend_distribution_id)"
          aws s3 sync dist/assets/ "s3://$bucket/assets/" --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ "s3://$bucket/" --only-show-errors --delete --exclude "assets/*" \
            --cache-control "no-cache"
          aws s3 sync dist/assets/ "s3://$bucket/assets/" --only-show-errors --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws cloudfront create-invalidation --distribution-id "$distribution" \
            --paths "/index.html" > /dev/null
          echo "Frontend uploaded and the cache for /index.html cleared." >> "$GITHUB_STEP_SUMMARY"

name: Checks

# Runs on every PR, and before every deploy (deploy.yml calls this workflow).
# Uses no secrets and no AWS access, so it's safe for PRs from forks.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Lint, test, Terraform checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Device private keys must never be committed (docs/features/iot-core.md).
      # Prints only file paths, never file contents.
      - name: No private keys in the repo
        run: |
          found=$( { git ls-files -- 'secrets/*' 'devices/keys/*'; git grep -lI -E -e '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' || true; } | sort -u)
          if [ -n "$found" ]; then
            echo "::error::Private key files are tracked by git. Remove them and replace the keys:"
            echo "$found"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same dev image as local development (docker/dev.Dockerfile), cached between runs.
      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev.Dockerfile
          tags: silvercare-dev:local
          load: true
          cache-from: type=gha,scope=silvercare-dev
          cache-to: type=gha,mode=max,scope=silvercare-dev

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Integration tests (DynamoDB Local)
        run: make test-integration

      - name: Terraform checks (fmt, validate, tflint, checkov)
        run: make tf-check

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for frontend app
        id: app
        working-directory: .
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend app yet, skipping."
          fi

      - name: Set up Node
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.app.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.app.outputs.present == 'true'
        run: npm run lint

      - name: Test
        if: steps.app.outputs.present == 'true'
        run: npm run test

      - name: Build
        if: steps.app.outputs.present == 'true'
        run: npm run build
